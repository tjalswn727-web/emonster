name: fetch-attachments
on:
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download issue attachments
        run: |
          mkdir -p uploads/newmonster2
          curl -sSL "https://github.com/user-attachments/assets/f67c8dbe-42e0-4a3c-842c-dc27e15c3476" -o uploads/newmonster2/1.png
          curl -sSL "https://github.com/user-attachments/assets/ec81a79e-8ebb-428d-af3f-4d3eb24df4a5" -o uploads/newmonster2/2.png
          curl -sSL "https://github.com/user-attachments/assets/dc2777c0-9a5c-4d1a-93ee-c825f76cfcf2" -o uploads/newmonster2/3.png
          curl -sSL "https://github.com/user-attachments/assets/ece36d90-287a-4327-a867-ac10c97f5311" -o uploads/newmonster2/4.png
          curl -sSL "https://github.com/user-attachments/assets/9e451c3f-c8de-4a46-a6e1-d4a2d4e0d7f8" -o uploads/newmonster2/5.png
          ls -la uploads/newmonster2
          file uploads/newmonster2/*
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uploads/newmonster2
          git commit -m "chore: fetch issue attachments (monster2)" || echo "nothing to commit"
          git push
